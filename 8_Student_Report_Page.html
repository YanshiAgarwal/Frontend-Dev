<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Page</title>
</head>
<body>
    <h1 title="Delhi Public School">Delhi Public School</h1>
    <table border="1" cellpadding="8">
        <tr>
            <th rowspan="2" title="Subject Name">Subject</th>
            <th colspan="2" title="Marks Obtained">Marks</th>
        </tr>
        <tr>
            <th title="Theory Marks">Theory</th>
            <th title="Practical Marks">Practical</th>
        </tr>
        <tr>
            <td title="Mathematics">Mathematics</td>
            <td>90</td>
            <td>28</td>
        </tr>
        <tr>
            <td title="Science">Science</td>
            <td>85</td>
            <td>25</td>
        </tr>
        <tr>
            <td title="English">English</td>
            <td>88</td>
            <td>--</td>
        </tr>
        <tr>
            <td title="Social Studies">Social Studies</td>
            <td>80</td>
            <td>--</td>
        </tr>
        <tr>
            <td title="Computer">Computer</td>
            <td>75</td>
            <td>30</td>
        </tr>
        <tr>
            <td colspan="2" style="text-align:right;" title="Total Marks">Total</td>
            <td title="Total Marks">501</td>
        </tr>
        <tr>
            <td colspan="2" style="text-align:right;" title="Percentage">Percentage</td>
            <td title="Percentage">83.5%</td>
        </tr>
    </table>
</body>
</html>
