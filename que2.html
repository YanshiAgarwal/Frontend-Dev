<!DOCTYPE html>
<html>
<head>
    <title>Product List Manager</title>
    <style>
        ul { list-style: none; padding: 0; }
        li { padding: 8px; background: #f2f2f2; margin: 5px 0; display: flex; justify-content: space-between; }
        button { margin-left: 10px; }
        input.editing { width: 60%; }
    </style>
</head>
<body>

<h2>Live Character Counter</h2>

<textarea id="textBox" rows="4" cols="40"></textarea>
<p>Remaining: <span id="count">100</span></p>
<button id="reset">Reset</button>

<style>
    #count.yellow { color: orange; }
    #count.red { color: red; }
</style>

<script src="que2.js"></script>

</body>
</html>
